services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-lodgekeeper_app}
      APP_DB_USER: ${APP_DB_USER:-lodgekeeper_app}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-lodgekeeper_owner}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-lodgekeeper_owner}
      POSTGRES_DB: ${POSTGRES_DB:-lodgekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-lodgekeeper_test}
      POSTGRES_USER: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - lodgekeeper-postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"',
        ]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  lodgekeeper-postgres:
